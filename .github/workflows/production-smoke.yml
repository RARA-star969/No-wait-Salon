name: Deployed service smoke test

# Verifies a deployed service from a runner, which (unlike a development
# sandbox) can reach onrender.com. Defaults to production; point base_url at
# the isolated test service to check a feature branch deployment.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Service to check
        required: false
        default: https://no-wait-salon-api.onrender.com
      commit:
        description: Commit SHA production is expected to be running
        required: false
        default: ''
      with_booking:
        description: Also run a live booking round-trip (creates and cancels one booking)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Smoke test the deployed service
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          WITH_BOOKING: ${{ inputs.with_booking }}
          BASE_URL: ${{ inputs.base_url || 'https://no-wait-salon-api.onrender.com' }}
        run: |
          # The free tier sleeps; give it a chance to wake before judging it.
          curl --fail --retry 6 --retry-all-errors --retry-delay 10 --max-time 90 "${BASE_URL}/api/health" > /dev/null
          ARGS=("${BASE_URL}")
          if [[ -n "${EXPECTED_COMMIT}" ]]; then ARGS+=("${EXPECTED_COMMIT}"); fi
          if [[ "${WITH_BOOKING}" == "true" ]]; then ARGS+=("--with-booking"); fi
          node scripts/production-smoke.mjs "${ARGS[@]}"
