name: TEMP - Customer fix APK build (physical test, TEST API)

# TEMPORARY workflow for physical testing of a specific already-audited and
# already-tested commit before it is promoted to main. Delete this file (and
# the ci/integration-apk-build branch) once testing is done.
#
# Safety properties:
#   - The application source built here is pinned to a specific commit SHA
#     (FIX_SHA below), not to whatever this workflow file's own commit
#     happens to be — so the branch this workflow lives on can safely carry
#     a later commit (this workflow file itself) without that commit ever
#     becoming part of the built APK.
#   - Points at the isolated hosted TEST backend
#     (https://no-wait-salon-web-test.onrender.com), never the production API.
#   - Debug-signed only. No release signing, no Play Store upload, no
#     production deploy step of any kind.
#   - Runs tsc, the full test suite, and the Customer APK build; fails
#     closed if any step fails.
#   - Builds only the Customer APK — the reported white-screen regression is
#     Customer-app-only, and the Staff APK from the prior integration SHA
#     (3fa1cf87051f3023e56fb8ffe88e4838c146b010) is unaffected by this fix.
#   - Now pinned to dd894d415cd8acb14a40eb7b6e34683b46fd91eb: the actual
#     root-cause fix (businessReviewService.ts's wrong API base) on top of
#     the prior DetailErrorBoundary safety-net commit (139f93f).

on:
  push:
    branches:
      - ci/integration-apk-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integration-apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FIX_SHA: dd894d415cd8acb14a40eb7b6e34683b46fd91eb
  VITE_API_BASE_URL: https://no-wait-salon-web-test.onrender.com

jobs:
  build-customer-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact fix SHA (not the workflow commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX_SHA }}

      - name: Confirm checked-out commit matches the pinned fix SHA
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Checked out: $actual"
          echo "Expected:    ${FIX_SHA}"
          test "$actual" = "${FIX_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build Customer debug APK (TEST API)
        env:
          APP_VERSION_NAME: 0.0.0-fix-test.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:customer

      - name: Confirm the built web bundle was compiled against the TEST API
        shell: bash
        run: |
          dir=android-customer/app/src/main/assets/public
          echo "Checking $dir"
          if ! grep -rl "no-wait-salon-web-test.onrender.com" "$dir" >/dev/null; then
            echo "TEST API base URL not found baked into $dir" >&2
            exit 1
          fi
          if grep -rl "no-wait-salon-api.onrender.com" "$dir" >/dev/null; then
            echo "Production API base URL unexpectedly present in $dir" >&2
            exit 1
          fi
          echo "Bundle references only the TEST API base URL."

      - name: Stage APK and generate checksum
        shell: bash
        run: |
          mkdir -p fix-artifacts
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk \
            "fix-artifacts/NOQ-Customer-fix-test-${FIX_SHA::12}.apk"
          (cd fix-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          echo "Application source SHA: ${FIX_SHA}" > fix-artifacts/SOURCE_SHA.txt
          cat fix-artifacts/SHA256SUMS.txt
          ls -la fix-artifacts

      - name: Upload Customer APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noq-customer-fix-test-apk-${{ github.run_number }}
          path: |
            fix-artifacts/NOQ-Customer-fix-test-*.apk
            fix-artifacts/SHA256SUMS.txt
            fix-artifacts/SOURCE_SHA.txt
          retention-days: 14
          if-no-files-found: error
