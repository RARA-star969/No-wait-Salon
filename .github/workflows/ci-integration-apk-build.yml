name: TEMP - Integration APK build (physical test, TEST API)

# TEMPORARY workflow for physical testing of a specific already-audited and
# already-tested commit before it is promoted to main. Delete this file (and
# the ci/integration-apk-build branch) once testing is done.
#
# Safety properties:
#   - The application source built here is pinned to a specific commit SHA
#     (INTEGRATION_SHA below), not to whatever this workflow file's own
#     commit happens to be — so the branch this workflow lives on can safely
#     carry a later commit (this workflow file itself) without that commit
#     ever becoming part of the built APKs.
#   - Points at the isolated hosted TEST backend
#     (https://no-wait-salon-web-test.onrender.com), never the production API.
#   - Debug-signed only. No release signing, no Play Store upload, no
#     production deploy step of any kind.
#   - Runs tsc, the full test suite, and both APK builds; fails closed if any
#     step fails.

on:
  push:
    branches:
      - ci/integration-apk-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integration-apk-build-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRATION_SHA: 3fa1cf87051f3023e56fb8ffe88e4838c146b010
  VITE_API_BASE_URL: https://no-wait-salon-web-test.onrender.com

jobs:
  build-both-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tested integration SHA (not the workflow commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_SHA }}

      - name: Confirm checked-out commit matches the pinned integration SHA
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Checked out: $actual"
          echo "Expected:    ${INTEGRATION_SHA}"
          test "$actual" = "${INTEGRATION_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build Customer debug APK (TEST API)
        env:
          APP_VERSION_NAME: 0.0.0-integration-test.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:customer

      - name: Build Staff / NOQ Business debug APK (TEST API)
        env:
          APP_VERSION_NAME: 0.0.0-integration-test.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:staff

      - name: Confirm the built web bundles were compiled against the TEST API
        shell: bash
        run: |
          for dir in android-customer/app/src/main/assets/public android-staff/app/src/main/assets/public; do
            echo "Checking $dir"
            if ! grep -rl "no-wait-salon-web-test.onrender.com" "$dir" >/dev/null; then
              echo "TEST API base URL not found baked into $dir" >&2
              exit 1
            fi
            if grep -rl "no-wait-salon-api.onrender.com" "$dir" >/dev/null; then
              echo "Production API base URL unexpectedly present in $dir" >&2
              exit 1
            fi
          done
          echo "Both bundles reference only the TEST API base URL."

      - name: Stage APKs and generate checksums
        shell: bash
        run: |
          mkdir -p integration-artifacts
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk \
            "integration-artifacts/NOQ-Customer-integration-test-${INTEGRATION_SHA::12}.apk"
          cp android-staff/app/build/outputs/apk/debug/app-debug.apk \
            "integration-artifacts/NOQ-Business-integration-test-${INTEGRATION_SHA::12}.apk"
          (cd integration-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          echo "Application source SHA: ${INTEGRATION_SHA}" > integration-artifacts/SOURCE_SHA.txt
          cat integration-artifacts/SHA256SUMS.txt
          ls -la integration-artifacts

      - name: Upload Customer APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noq-customer-integration-test-apk-${{ github.run_number }}
          path: |
            integration-artifacts/NOQ-Customer-integration-test-*.apk
            integration-artifacts/SHA256SUMS.txt
            integration-artifacts/SOURCE_SHA.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload Staff APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noq-business-integration-test-apk-${{ github.run_number }}
          path: |
            integration-artifacts/NOQ-Business-integration-test-*.apk
            integration-artifacts/SHA256SUMS.txt
            integration-artifacts/SOURCE_SHA.txt
          retention-days: 14
          if-no-files-found: error
