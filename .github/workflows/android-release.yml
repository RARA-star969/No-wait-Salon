name: Android production release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release tag (for example, v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://no-wait-salon-api.onrender.com
      NOWAIT_KEY_ALIAS: no-wait-salon
      NOWAIT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NOWAIT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then TAG="${INPUT_VERSION}"; fi
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use strict SemVer, for example v0.1.0" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "name=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/no-wait-salon-release.jks"
          echo "NOWAIT_KEYSTORE_PATH=${RUNNER_TEMP}/no-wait-salon-release.jks" >> "${GITHUB_ENV}"

      - name: Smoke-test production backend
        run: curl --fail --retry 4 --retry-all-errors --max-time 70 "${VITE_API_BASE_URL}/api/health"

      - name: Build customer release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:release:customer

      - name: Build staff release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:release:staff

      - name: Verify and stage APKs
        shell: bash
        run: |
          mkdir -p release-artifacts
          CUSTOMER_APK=android-customer/app/build/outputs/apk/release/app-release.apk
          STAFF_APK=android-staff/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "${APKSIGNER}" verify --verbose "${CUSTOMER_APK}"
          "${APKSIGNER}" verify --verbose "${STAFF_APK}"
          cp "${CUSTOMER_APK}" "release-artifacts/No-Wait-Salon-Customer-${{ steps.version.outputs.tag }}.apk"
          cp "${STAFF_APK}" "release-artifacts/No-Wait-Salon-Staff-${{ steps.version.outputs.tag }}.apk"
          sha256sum release-artifacts/*.apk > release-artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "No-Wait Salon ${TAG}" \
              --generate-notes \
              --notes "Signed Customer and Salon Staff Android APKs connected to ${VITE_API_BASE_URL}. Backend health smoke test and APK signature verification passed in CI."
          fi
