name: Android customer test build

# Produces an unsigned/debug-signed Customer APK for physical device testing.
# This never touches the release signing keystore, so it needs no repository
# secrets. Release builds stay in android-release.yml.

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Override the API the APK talks to (defaults to production). Use this to point a test build at a preview/test backend.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-debug-apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://no-wait-salon-api.onrender.com' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build customer debug APK
        env:
          APP_VERSION_NAME: 0.1.4-qrfix.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:customer

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p test-artifacts
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk \
            "test-artifacts/No-Wait-Salon-Customer-test-0.1.4-qrfix.${{ github.run_number }}.apk"
          sha256sum test-artifacts/*.apk > test-artifacts/SHA256SUMS.txt
          ls -la test-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-test-apk-${{ github.run_number }}
          path: test-artifacts/
          retention-days: 14
          if-no-files-found: error
