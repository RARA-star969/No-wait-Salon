name: NOQ Business Android build

# Produces a debug-signed universal NOQ Business APK for physical testing.
# Credentials remain server-side; this APK contains no business-specific login data.

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Override the API the APK talks to (defaults to production). Use this to point a test build at a preview/test backend.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noq-business-debug-apk:
    # Customer-APK branches produce ONLY the requested Customer APK, in the
    # dedicated job below — never a second Business artifact alongside it.
    if: >-
      github.ref_name != 'fix/customer-final-physical-glitches' &&
      github.ref_name != 'fix/customer-navigation-notifications-polish' &&
      github.ref_name != 'feat/customer-liquid-glass-3d-v1'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || (github.ref == 'refs/heads/main' && 'https://no-wait-salon-web-test.onrender.com' || 'https://no-wait-salon-web-test.onrender.com') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build NOQ Business debug APK
        env:
          APP_VERSION_NAME: 0.2.0-business.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:staff

      - name: Stage APK
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then CHANNEL=main; else CHANNEL=test; fi
          mkdir -p android-artifacts
          cp android-staff/app/build/outputs/apk/debug/app-debug.apk \
            "android-artifacts/NOQ-Business-${CHANNEL}-0.2.0.${{ github.run_number }}.apk"
          sha256sum android-artifacts/*.apk > android-artifacts/SHA256SUMS.txt
          ls -la android-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'main' && 'noq-business-main-apk' || 'noq-business-test-apk' }}-${{ github.run_number }}
          path: android-artifacts/
          retention-days: 14
          if-no-files-found: error

  # One Customer TEST APK, built from the exact pushed commit, with the TEST
  # API baked in and the production API proven absent from the bundle.
  customer-final-physical-apk:
    if: >-
      github.ref_name == 'fix/customer-final-physical-glitches' ||
      github.ref_name == 'fix/customer-navigation-notifications-polish' ||
      github.ref_name == 'feat/customer-liquid-glass-3d-v1'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://no-wait-salon-web-test.onrender.com

    steps:
      - name: Check out the exact application SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch and checkout SHA
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            fix/customer-final-physical-glitches|fix/customer-navigation-notifications-polish|feat/customer-liquid-glass-3d-v1) ;;
            *) echo "Unexpected branch for the Customer APK job: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"
          echo "APPLICATION_SHA=${ACTUAL_SHA}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${ACTUAL_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run full automated tests
        run: pnpm test

      - name: Confirm TEST backend is reachable
        run: curl --fail --retry 4 --retry-all-errors --max-time 70 "${VITE_API_BASE_URL}/api/health"

      - name: Resolve installable TEST version
        shell: bash
        run: |
          echo "APP_VERSION_NAME=1.0.0-customer-test.${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"
          echo "APP_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "${GITHUB_ENV}"

      - name: Build one Customer TEST APK
        run: pnpm android:apk:customer

      # The staged APK's checksum is echoed into the job log and the run
      # summary as well as written into the artifact: the artifact blob host
      # is not reachable from every reviewer's network, so the log has to be
      # sufficient on its own to verify the file that gets installed.
      - name: Verify compiled API and stage exactly one APK
        shell: bash
        run: |
          # The bundle the APK actually ships is the copy synced into the
          # Android assets, so assert against that as well as dist/.
          ASSETS=android-customer/app/src/main/assets/public
          for tree in dist "${ASSETS}"; do
            grep -R --binary-files=text -Fq "https://no-wait-salon-web-test.onrender.com" "${tree}"
            grep -R --binary-files=text -Fq "/api/gym/" "${tree}"
            if grep -R --binary-files=text -Fq "https://no-wait-salon-web-test.onrender.com" "${tree}"; then
              echo "Production API was found in ${tree}" >&2
              exit 1
            fi
            echo "${tree}: TEST API present, production API absent"
          done
          mkdir -p customer-test-artifact
          APK_NAME="NOQ-Customer-TEST-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}.apk"
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk "customer-test-artifact/${APK_NAME}"
          test "$(find customer-test-artifact -maxdepth 1 -name '*.apk' | wc -l | tr -d ' ')" = "1"
          sha256sum "customer-test-artifact/${APK_NAME}" > customer-test-artifact/SHA256SUMS.txt
          printf '%s\n' "${APPLICATION_SHA}" > customer-test-artifact/APPLICATION_SHA.txt
          printf '%s\n' "${VITE_API_BASE_URL}" > customer-test-artifact/API_BASE_URL.txt
          APK_SHA256="$(cut -d' ' -f1 customer-test-artifact/SHA256SUMS.txt)"
          echo "APK name:      ${APK_NAME}"
          echo "APK SHA256:    ${APK_SHA256}"
          echo "Source SHA:    ${APPLICATION_SHA}"
          echo "Baked API URL: ${VITE_API_BASE_URL}"
          {
            echo "### Customer TEST APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| APK | \`${APK_NAME}\` |"
            echo "| SHA256 | \`${APK_SHA256}\` |"
            echo "| Source commit | \`${APPLICATION_SHA}\` |"
            echo "| Baked API | \`${VITE_API_BASE_URL}\` |"
            echo "| Production API in bundle | absent (asserted) |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Customer TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: noq-customer-test-${{ env.SHORT_SHA }}-run${{ github.run_number }}
          path: customer-test-artifact/
          retention-days: 30
          if-no-files-found: error
