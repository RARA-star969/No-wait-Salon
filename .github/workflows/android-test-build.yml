name: NOQ Android test builds

# Produces debug-signed universal Customer and NOQ Business APKs for physical
# testing. Credentials remain server-side; neither APK contains login data.

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Override the API the APK talks to (defaults to production). Use this to point a test build at a preview/test backend.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noq-customer-debug-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://no-wait-salon-web-test.onrender.com' }}

    steps:
      - name: Check out exact TEST source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Confirm TEST API only
        shell: bash
        run: |
          test "${VITE_API_BASE_URL}" = "https://no-wait-salon-web-test.onrender.com"
          curl --fail --retry 4 --retry-all-errors --max-time 70 "${VITE_API_BASE_URL}/api/health"

      - name: Build Customer TEST debug APK
        env:
          APP_VERSION_NAME: 0.2.0-customer-test.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:customer

      - name: Stage Customer TEST APK
        shell: bash
        run: |
          mkdir -p android-artifacts
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk \
            "android-artifacts/NOQ-Customer-TEST-0.2.0.${{ github.run_number }}.apk"
          sha256sum android-artifacts/*.apk > android-artifacts/SHA256SUMS.txt

      - name: Upload Customer TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: noq-customer-test-apk-${{ github.run_number }}
          path: android-artifacts/
          retention-days: 14
          if-no-files-found: error

  noq-business-debug-apk:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || (github.ref == 'refs/heads/main' && 'https://no-wait-salon-api.onrender.com' || 'https://no-wait-salon-web-test.onrender.com') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build NOQ Business debug APK
        env:
          APP_VERSION_NAME: 0.2.0-business.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: pnpm android:apk:staff

      - name: Stage APK
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then CHANNEL=main; else CHANNEL=test; fi
          mkdir -p android-artifacts
          cp android-staff/app/build/outputs/apk/debug/app-debug.apk \
            "android-artifacts/NOQ-Business-${CHANNEL}-0.2.0.${{ github.run_number }}.apk"
          sha256sum android-artifacts/*.apk > android-artifacts/SHA256SUMS.txt
          ls -la android-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'main' && 'noq-business-main-apk' || 'noq-business-test-apk' }}-${{ github.run_number }}
          path: android-artifacts/
          retention-days: 14
          if-no-files-found: error
