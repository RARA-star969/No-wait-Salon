name: Android customer test build

# Produces an unsigned/debug-signed Customer APK for physical device testing.
# This never touches the release signing keystore, so it needs no repository
# secrets. Release builds stay in android-release.yml.

on:
  push:
    branches:
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend this APK talks to (default is production)
        required: false
        default: https://no-wait-salon-api.onrender.com
      label:
        description: Short tag added to the version and artifact name (e.g. testapi)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-debug-apk:
    runs-on: ubuntu-latest
    env:
      # Defaults to the PRODUCTION API for push builds, which validate the
      # client-side work against the backend customers already use. Dispatch
      # with api_base_url set to the isolated test service to exercise
      # server-side changes that are not on production yet.
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://no-wait-salon-api.onrender.com' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Version codes are offset above the production series (which reached
      # 102) so a test build always installs over the production candidate
      # instead of being refused by Android as a downgrade.
      # The backend must be awake and healthy before its URL is baked into an
      # APK, or the build ships pointing at something that never answers. The
      # free tier sleeps, so the first request can take most of a minute.
      - name: Confirm the target backend is reachable
        run: curl --fail --retry 6 --retry-all-errors --retry-delay 10 --max-time 90 "${VITE_API_BASE_URL}/api/health"

      - name: Resolve version
        id: version
        shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          SUFFIX=""
          if [[ -n "${LABEL}" ]]; then SUFFIX="-${LABEL}"; fi
          echo "code=$(( 200 + ${{ github.run_number }} ))" >> "${GITHUB_OUTPUT}"
          echo "name=1.1.0-beta.${{ github.run_number }}${SUFFIX}" >> "${GITHUB_OUTPUT}"
          echo "artifact=customer-beta-apk-${{ github.run_number }}${SUFFIX}" >> "${GITHUB_OUTPUT}"

      - name: Build customer debug APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: pnpm android:apk:customer

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p test-artifacts
          cp android-customer/app/build/outputs/apk/debug/app-debug.apk \
            "test-artifacts/No-Wait-Salon-Customer-beta-${{ steps.version.outputs.name }}.apk"
          sha256sum test-artifacts/*.apk > test-artifacts/SHA256SUMS.txt
          {
            echo "backend: ${VITE_API_BASE_URL}"
            echo "commit:  ${GITHUB_SHA}"
            echo "version: ${{ steps.version.outputs.name }} (code $(( 200 + ${{ github.run_number }} )))"
          } > test-artifacts/BUILD-TARGET.txt
          cat test-artifacts/BUILD-TARGET.txt
          ls -la test-artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: test-artifacts/
          retention-days: 14
          if-no-files-found: error
