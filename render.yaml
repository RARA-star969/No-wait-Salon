services:
  - type: web
    name: no-wait-salon-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/no-wait-salon-data
      - key: ALLOWED_ORIGINS
        value: capacitor://localhost,http://localhost
