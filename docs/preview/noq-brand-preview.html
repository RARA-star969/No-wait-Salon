<title>NOQ Category Worlds</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --bg:#0A0B10;
    --surface:#14161D;
    --surface-2:#1A1D26;
    --border:rgba(255,255,255,.08);
    --border-soft:rgba(255,255,255,.05);
    --text:#FFFFFF;
    --text-2:#9CA0AC;
    --text-3:#666B78;
    --brand:#8A5CFF;
    --brand-2:#B79CFF;
    --font-display:'Sora',ui-sans-serif,system-ui,sans-serif;
    --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1000px 560px at 18% -10%, rgba(138,92,255,.10), transparent 58%),
      radial-gradient(900px 520px at 85% 0%, rgba(255,201,74,.05), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:rgba(138,92,255,.3);}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 26px; background:rgba(10,11,16,.72); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand-row{display:flex; align-items:center; gap:9px;}
  .brand-mark{
    width:26px;height:26px;border-radius:8px;
    background:linear-gradient(155deg,var(--brand),#5E3FCB);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px -6px rgba(138,92,255,.7), inset 0 1px 0 rgba(255,255,255,.25);
    color:#fff; font-family:var(--font-display); font-weight:800; font-size:13px;
  }
  .brand-word{font-family:var(--font-display); font-weight:800; font-size:14.5px; letter-spacing:.02em;}
  .topbar .sub{font-size:12px; color:var(--text-3);}
  .preview-tag{
    display:flex; align-items:center; gap:7px;
    font:700 10.5px/1 var(--font-mono); letter-spacing:.07em; text-transform:uppercase;
    color:#FFC94A; background:rgba(255,201,74,.1); border:1px solid rgba(255,201,74,.3);
    padding:7px 12px; border-radius:999px;
  }
  .preview-tag .dot{width:6px;height:6px;border-radius:50%;background:#FFC94A; box-shadow:0 0 0 3px rgba(255,201,74,.18);}

  .stage{
    display:flex; justify-content:center; align-items:flex-start;
    gap:56px; padding:56px 32px 90px; flex-wrap:wrap;
  }

  .col{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .col-label{display:flex; align-items:center; gap:8px;}
  .col-label .sw{width:9px;height:9px;border-radius:50%;}
  .col-label span{font:700 13px var(--font-body); color:var(--text); letter-spacing:.01em;}
  .col-label small{font:600 10.5px var(--font-mono); color:var(--text-3); letter-spacing:.04em; text-transform:uppercase; margin-left:2px;}

  /* ---------- phone ---------- */
  .phone{
    position:relative; width:328px; height:684px;
    background:linear-gradient(180deg,#020203,#08090C);
    border-radius:50px; padding:13px;
    box-shadow:0 3px 0 rgba(255,255,255,.06) inset, 0 50px 100px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.04);
  }
  .phone-screen{
    position:relative; width:100%; height:100%; border-radius:39px; overflow:hidden;
    background:var(--bg);
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:90px; height:22px; border-radius:13px; background:#000; z-index:40;
  }
  .statusbar{display:flex; justify-content:space-between; align-items:center; padding:18px 22px 0; font:700 12px var(--font-body); color:#fff; flex-shrink:0;}

  .screen-body{flex:1; overflow:hidden; padding:14px 16px 0; display:flex; flex-direction:column; gap:13px;}

  .app-header{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .loc{display:flex; flex-direction:column; gap:2px;}
  .loc .l1{display:flex; align-items:center; gap:4px; font:700 12.5px var(--font-body); color:#fff;}
  .loc .l2{font:600 9.5px var(--font-body); color:var(--text-2);}
  .head-actions{display:flex; align-items:center; gap:7px;}
  .wallet-chip{
    display:flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border);
    padding:7px 10px; border-radius:11px; font:700 10.5px var(--font-mono); color:#fff;
  }
  .avatar{
    width:29px;height:29px;border-radius:10px; background:linear-gradient(155deg,var(--brand),#5E3FCB);
    flex-shrink:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
  }

  .search-shell{
    display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:14px; padding:11px 13px; color:var(--text-2); font:600 11px var(--font-body);
  }
  .search-shell svg{flex-shrink:0; opacity:.8;}
  .search-shell .filt{
    margin-left:auto; width:26px; height:26px; border-radius:8px; background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);
  }

  /* ---------- floating deck ---------- */
  .deck-zone{position:relative; height:200px; margin:4px 0 2px; flex-shrink:0;}
  .deck-glow{
    position:absolute; inset:-30px -10px auto -10px; height:220px; border-radius:50%;
    filter:blur(46px); opacity:.5; z-index:0;
  }
  .deck{position:relative; height:100%; z-index:1;}
  .card{
    position:absolute; top:6px; left:50%; width:172px; height:186px; border-radius:26px;
    overflow:hidden; border:1px solid var(--border);
  }
  .card .scene-svg{position:absolute; inset:0; width:100%; height:100%; display:block;}
  .card .scrim{position:absolute; inset:0;}
  .card.back-l{
    transform:translate(-158px,20px) rotate(-11deg) scale(.82);
    z-index:1; box-shadow:0 20px 34px -18px rgba(0,0,0,.7);
  }
  .card.back-r{
    transform:translate(50px,20px) rotate(11deg) scale(.82);
    z-index:1; box-shadow:0 20px 34px -18px rgba(0,0,0,.7);
  }
  .card.back-l .scrim, .card.back-r .scrim{background:rgba(6,7,10,.5);}
  .card.back-l{filter:saturate(.82) brightness(.72);}
  .card.back-r{filter:saturate(.82) brightness(.72);}
  .card.front{
    transform:translate(-86px,0) scale(1); z-index:3;
    box-shadow:0 26px 46px -16px var(--cat-shadow, rgba(138,92,255,.55)), 0 6px 18px -6px rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.14);
  }
  .card.front .scrim{background:linear-gradient(185deg, rgba(6,7,10,0) 34%, rgba(6,7,10,.55) 68%, rgba(4,5,7,.92) 100%);}
  .card-content{
    position:absolute; left:0; right:0; bottom:0; padding:12px 13px 13px; z-index:2;
  }
  .card-eyebrow{
    display:inline-flex; align-items:center; gap:4px; font:800 8px var(--font-mono); letter-spacing:.06em; text-transform:uppercase;
    color:#0B0D12; background:rgba(255,255,255,.92); padding:3px 7px; border-radius:6px;
  }
  .card-content .cname{font-family:var(--font-display); font-weight:800; font-size:15.5px; color:#fff; margin-top:7px; line-height:1.08;}
  .card-content .ctag{font-size:9px; color:rgba(255,255,255,.72); margin-top:3px; line-height:1.3;}
  .card-content .ccta{
    display:inline-flex; align-items:center; gap:4px; margin-top:8px;
    font:700 8.5px var(--font-body); color:#fff; border-bottom:1.5px solid var(--cat, var(--brand)); padding-bottom:1px;
  }

  /* ---------- banner ---------- */
  .banner{
    position:relative; display:flex; border-radius:20px; background:var(--surface); border:1px solid var(--border);
    overflow:hidden; flex-shrink:0; height:118px;
  }
  .banner-copy{
    width:56%; padding:13px 12px 13px 15px; display:flex; flex-direction:column; justify-content:center; gap:5px; position:relative; z-index:2;
  }
  .banner-copy .badge{
    align-self:flex-start; font:800 8px var(--font-mono); letter-spacing:.05em; text-transform:uppercase;
    color:#0B0D12; background:#fff; padding:3px 7px; border-radius:6px;
  }
  .banner-copy h4{font-family:var(--font-display); font-size:14px; font-weight:800; color:#fff; line-height:1.15; margin:0;}
  .banner-copy p{font-size:9px; color:var(--text-2); line-height:1.4; margin:0;}
  .banner-copy .cta{
    align-self:flex-start; margin-top:2px; display:inline-flex; align-items:center; gap:5px;
    background:var(--brand); color:#fff; font:700 9px var(--font-body); padding:7px 11px; border-radius:9px;
  }
  .banner-art{width:44%; position:relative; overflow:hidden;}
  .banner-art .scene-svg{position:absolute; inset:0; width:100%; height:100%;}
  .banner-art .scrim{position:absolute; inset:0; background:linear-gradient(90deg, var(--surface) 0%, rgba(20,22,29,0) 34%);}

  /* ---------- listings ---------- */
  .listing-head{display:flex; justify-content:space-between; align-items:baseline; flex-shrink:0;}
  .listing-head span:first-child{font:700 12.5px var(--font-body); color:#fff;}
  .listing-head span:last-child{font:600 10px var(--font-body); color:var(--brand-2);}
  .listings{display:flex; flex-direction:column; gap:9px; flex:1; min-height:0; overflow:hidden;}
  .listing-card{
    display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-left:2.5px solid var(--cat, var(--brand)); border-radius:14px; padding:8px; flex-shrink:0;
  }
  .listing-card .thumb{
    width:52px; height:52px; border-radius:10px; overflow:hidden; position:relative; flex-shrink:0; background:var(--surface-2);
  }
  .listing-card .thumb .scene-svg{position:absolute; inset:0; width:100%; height:100%;}
  .listing-info{min-width:0; flex:1; display:flex; flex-direction:column; gap:3px;}
  .listing-info .lname{font:700 11.5px var(--font-body); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .listing-info .lmeta{display:flex; align-items:center; gap:6px; font:600 9px var(--font-body); color:var(--text-2);}
  .listing-info .lmeta .rate{display:flex; align-items:center; gap:3px; color:#FFC94A; font-weight:700;}
  .listing-info .lmeta .sep{width:3px;height:3px;border-radius:50%; background:var(--text-3);}
  .book-pill{
    flex-shrink:0; font:700 8.5px var(--font-body); color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); padding:6px 10px; border-radius:9px;
  }

  .bottom-nav{
    margin-top:auto; flex-shrink:0; display:flex; align-items:center; justify-content:space-around;
    background:var(--surface); border-top:1px solid var(--border); padding:12px 8px 16px;
  }
  .nav-item{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-3);}
  .nav-item.active{color:var(--brand-2);}
  .nav-item span.lbl{font:700 7.5px var(--font-body);}
  .nav-qr{
    width:38px; height:38px; border-radius:12px; background:linear-gradient(155deg,var(--brand),#5E3FCB);
    display:flex; align-items:center; justify-content:center; margin-top:-20px; color:#fff;
    box-shadow:0 10px 20px -4px rgba(138,92,255,.75), 0 0 0 5px var(--bg);
  }

  footer{text-align:center; padding:0 20px 46px; color:var(--text-3); font-size:11.5px;}
  footer b{color:var(--text-2);}
</style>

<div class="topbar">
  <div class="brand-row">
    <div class="brand-mark">N</div>
    <span class="brand-word">NOQ</span>
    <span class="sub">&nbsp;· Customer Home — category worlds</span>
  </div>
  <div class="preview-tag"><span class="dot"></span>Preview only · not implemented</div>
</div>

<div class="stage" id="stage"></div>

<footer>Design-validation prototype only — <b>src/</b> and the live customer app are unchanged.</footer>

<script>
(function(){
  "use strict";
  let uidCounter = 0;
  const nextUid = () => 'u' + (uidCounter++);

  const CATS = [
    {
      key:'salon', name:'Salon', tagline:'Look good. Feel great.', color:'#00D1D8', deep:'#063C40',
      offerBadge:'25% OFF', offerHead:'Styled to perfection', offerSub:'25% off your first salon visit this week',
      ctaLabel:'Explore Salon', listLabel:'Top rated salons',
      listings:[
        {n:'Glow Studio', rating:'4.9', reviews:'2.1k', meta:'1.2 km · ₹₹'},
        {n:'Urban Cuts & Co.', rating:'4.7', reviews:'980', meta:'2.0 km · ₹'},
        {n:'Bliss Hair Lounge', rating:'4.8', reviews:'1.4k', meta:'0.8 km · ₹₹₹'},
      ],
      scene:(u)=>salonScene(u),
    },
    {
      key:'gym', name:'Gym', tagline:'Train. Transform. You.', color:'#7B61FF', deep:'#241852',
      offerBadge:'20% OFF', offerHead:'Stronger every day', offerSub:'20% off all gym sessions this month',
      ctaLabel:'Explore Gym', listLabel:'Popular gyms nearby',
      listings:[
        {n:'NOQ Elite Gym', rating:'4.8', reviews:'3.2k', meta:'0.6 km · ₹₹'},
        {n:'Iron Forge Fitness', rating:'4.6', reviews:'1.1k', meta:'1.5 km · ₹'},
        {n:'Fit Nation Studio', rating:'4.7', reviews:'2.0k', meta:'2.4 km · ₹₹'},
      ],
      scene:(u)=>gymScene(u),
    },
    {
      key:'shop', name:'Shop', tagline:'Everything you need.', color:'#FFC94A', deep:'#4A3608',
      offerBadge:'15% OFF', offerHead:'Deals you will love', offerSub:'15% off selected items, today only',
      ctaLabel:'Shop Now', listLabel:'Recommended for you',
      listings:[
        {n:'Trend Mart', rating:'4.5', reviews:'860', meta:'1.0 km · ₹₹'},
        {n:'Style Bazaar', rating:'4.6', reviews:'1.3k', meta:'1.8 km · ₹'},
        {n:'Urban Basket', rating:'4.4', reviews:'640', meta:'2.2 km · ₹₹'},
      ],
      scene:(u)=>shopScene(u),
    },
  ];

  const esc = (s) => String(s);

  function sceneWrap(u, color, deep, inner){
    return `<svg class="scene-svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bg-${u}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity=".9"/>
          <stop offset="55%" stop-color="${deep}"/>
          <stop offset="100%" stop-color="#0A0B10"/>
        </linearGradient>
        <radialGradient id="glow-${u}" cx="75%" cy="18%" r="55%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="200" height="200" fill="url(#bg-${u})"/>
      <rect width="200" height="200" fill="url(#glow-${u})"/>
      ${inner}
    </svg>`;
  }

  function salonScene(u){
    const inner = `
      <g opacity=".9">
        <path d="M132 198 C128 150 134 118 118 96 C108 83 108 66 122 55 C138 43 162 50 166 70 C169 84 161 94 152 100 C160 112 160 138 168 198 Z" fill="#050608" opacity=".85"/>
        <path d="M118 96 C112 80 118 62 134 55" stroke="${'#fff'}" stroke-opacity=".25" stroke-width="2" fill="none"/>
      </g>
      <g stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M60 46 C74 62 70 84 52 96"/>
        <path d="M50 40 C66 58 60 82 40 96"/>
        <path d="M42 58 C54 70 50 86 34 94"/>
      </g>
      <g transform="translate(38,100) rotate(-18)">
        <circle cx="0" cy="0" r="7.5" fill="none" stroke="#fff" stroke-width="2.6"/>
        <circle cx="0" cy="24" r="7.5" fill="none" stroke="#fff" stroke-width="2.6"/>
        <line x1="5" y1="5" x2="34" y2="34" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="5" y1="19" x2="34" y2="-10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <circle cx="168" cy="46" r="2.4" fill="#fff" opacity=".8"/>
      <circle cx="152" cy="30" r="1.6" fill="#fff" opacity=".6"/>
      <circle cx="24" cy="40" r="1.8" fill="#fff" opacity=".55"/>
    `;
    return sceneWrap(u, '#00D1D8', '#063C40', inner);
  }

  function gymScene(u){
    const inner = `
      <g opacity=".92">
        <path d="M40 198 C42 160 56 140 60 118 C64 96 84 84 100 92 C96 104 100 112 112 116 C128 122 140 108 150 118 C160 128 156 146 168 198 Z" fill="#050608" opacity=".82"/>
      </g>
      <g transform="translate(96,86) rotate(28)">
        <rect x="-58" y="-7" width="116" height="14" rx="6" fill="#fff" opacity=".92"/>
        <rect x="-78" y="-19" width="18" height="38" rx="7" fill="#fff"/>
        <rect x="60" y="-19" width="18" height="38" rx="7" fill="#fff"/>
        <rect x="-92" y="-13" width="12" height="26" rx="5" fill="#fff" opacity=".85"/>
        <rect x="80" y="-13" width="12" height="26" rx="5" fill="#fff" opacity=".85"/>
      </g>
      <g stroke="#ffffff" stroke-opacity=".4" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M150 150 C158 156 166 156 174 150"/>
        <path d="M146 162 C156 170 168 170 178 162"/>
      </g>
      <circle cx="176" cy="40" r="2.4" fill="#fff" opacity=".8"/>
      <circle cx="30" cy="52" r="1.8" fill="#fff" opacity=".5"/>
    `;
    return sceneWrap(u, '#7B61FF', '#241852', inner);
  }

  function shopScene(u){
    const inner = `
      <g transform="translate(58,150) rotate(-8)" opacity=".82">
        <rect x="-30" y="-46" width="60" height="58" rx="8" fill="#050608"/>
        <path d="M-16 -46 C-16 -58 16 -58 16 -46" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <g transform="translate(112,158) rotate(6)">
        <rect x="-34" y="-56" width="68" height="66" rx="9" fill="#050608" opacity=".94"/>
        <path d="M-18 -56 C-18 -70 18 -70 18 -56" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      </g>
      <g transform="translate(150,120) rotate(-4)">
        <rect x="-11" y="-16" width="42" height="30" rx="5" fill="#fff" opacity=".92"/>
        <circle cx="20" cy="-16" r="4.2" fill="#fff" opacity=".92"/>
      </g>
      <circle cx="42" cy="46" r="2" fill="#fff" opacity=".6"/>
      <circle cx="170" cy="52" r="2.4" fill="#fff" opacity=".8"/>
      <circle cx="150" cy="34" r="1.6" fill="#fff" opacity=".5"/>
    `;
    return sceneWrap(u, '#FFC94A', '#4A3608', inner);
  }

  function phoneHTML(cat){
    const catStyle = `--cat:${cat.color}`;
    const listings = cat.listings.map(l => `
      <div class="listing-card" style="${catStyle}">
        <div class="thumb">${cat.scene(nextUid())}</div>
        <div class="listing-info">
          <div class="lname">${esc(l.n)}</div>
          <div class="lmeta">
            <span class="rate">★ ${esc(l.rating)}</span>
            <span>(${esc(l.reviews)})</span>
            <span class="sep"></span>
            <span>${esc(l.meta)}</span>
          </div>
        </div>
        <span class="book-pill">Book</span>
      </div>`).join('');

    return `
    <div class="phone" style="${catStyle}; --cat-shadow:${cat.color}66;">
      <div class="phone-screen">
        <div class="notch"></div>
        <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
        <div class="screen-body">

          <div class="app-header">
            <div class="loc">
              <span class="l1">📍 DHA Phase 6, Lahore</span>
              <span class="l2">Deliver to Home</span>
            </div>
            <div class="head-actions">
              <div class="wallet-chip">💳 Rs.1,250</div>
              <div class="avatar"></div>
            </div>
          </div>

          <div class="search-shell">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
            <span>Search services, salons, gyms&hellip;</span>
            <div class="filt">≡</div>
          </div>

          <div class="deck-zone">
            <div class="deck-glow" style="background:${cat.color}"></div>
            <div class="deck">
              <div class="card back-l">${cat.scene(nextUid())}<div class="scrim"></div></div>
              <div class="card back-r">${cat.scene(nextUid())}<div class="scrim"></div></div>
              <div class="card front">
                ${cat.scene(nextUid())}
                <div class="scrim"></div>
                <div class="card-content">
                  <span class="card-eyebrow">NOQ ${esc(cat.name)}</span>
                  <div class="cname">${esc(cat.tagline)}</div>
                  <div class="ccta">${esc(cat.ctaLabel)} →</div>
                </div>
              </div>
            </div>
          </div>

          <div class="banner" style="${catStyle}">
            <div class="banner-copy">
              <span class="badge">${esc(cat.offerBadge)}</span>
              <h4>${esc(cat.offerHead)}</h4>
              <p>${esc(cat.offerSub)}</p>
              <span class="cta">${esc(cat.ctaLabel)} →</span>
            </div>
            <div class="banner-art">
              ${cat.scene(nextUid())}
              <div class="scrim"></div>
            </div>
          </div>

          <div class="listing-head">
            <span>${esc(cat.listLabel)}</span>
            <span>See all</span>
          </div>
          <div class="listings">${listings}</div>

          <div class="bottom-nav">
            <div class="nav-item active"><span>●</span><span class="lbl">Home</span></div>
            <div class="nav-item"><span>▤</span><span class="lbl">Bookings</span></div>
            <div class="nav-qr">▦</div>
